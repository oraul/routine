name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: |
          files=$(find bin lib caffeine -type f \( -name '*.sh' -o -path 'bin/*' \) 2>/dev/null | sort)
          if [ -n "$files" ]; then
            # shellcheck disable=SC2086
            shellcheck $files
          fi

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Install shellcheck (macos)
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: Install bats-core
        uses: actions/checkout@v4
        with:
          repository: bats-core/bats-core
          ref: v1.11.0
          path: .bats-core
      - name: Run the suite via selfcheck
        run: |
          export PATH="$PWD/.bats-core/bin:$PATH"
          bin/routine-selfcheck

  # Runs on both events: PRs check the branch, pushes to main check what
  # the push introduced — the merge commit's message included, which no
  # PR-side run can ever see (GitHub writes it at merge time).
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the diff base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$BASE_REF"
          elif printf '%s' "$BEFORE_SHA" | grep -Eq '^0+$' \
            || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            # First push or force push: check only the tip, never rescan
            # history that predates the harness.
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          else
            base="$BEFORE_SHA"
          fi
          echo "CONVENTION_BASE=$base" >> "$GITHUB_ENV"
      - name: convention check
        run: bin/routine-convention-check "$CONVENTION_BASE"

  openspec-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: openspec validate
        run: npx --yes @fission-ai/openspec@latest validate --all --strict
