# Scripted publication: dispatch with a tag, the gate decides, gh
# publishes. bats comes from npm (not a checkout) so the worktree stays
# clean — routine-release-check refuses a dirty tree.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Semver tag to publish (vX.Y.Z)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install shellcheck and bats
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          sudo npm install -g bats@1.11.0
      - name: Gate
        env:
          TAG: ${{ inputs.tag }}
        run: bin/routine-release-check "$TAG"
      - name: Publish tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$(git rev-parse HEAD)" \
            --title "routine $TAG" \
            --generate-notes
