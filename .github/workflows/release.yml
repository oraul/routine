# Scripted publication: request by dispatch or by pushing a
# release/vX.Y.Z branch (a message, not a source — the job always gates
# main). The gate decides, gh publishes. bats comes from npm (not a
# checkout) so the worktree stays clean — routine-release-check refuses
# a dirty tree.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Semver tag to publish (vX.Y.Z)"
        required: true
  push:
    branches: ["release/v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install shellcheck and bats
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          sudo npm install -g bats@1.11.0
      - name: Resolve tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-${REF_NAME#release/}}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Gate
        run: bin/routine-release-check "$TAG"
      - name: Publish tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin/routine-release-notes "$TAG" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "routine $TAG" \
              --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" \
              --target "$(git rev-parse HEAD)" \
              --title "routine $TAG" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
      - name: Delete the trigger branch
        if: startsWith(github.ref, 'refs/heads/release/v')
        run: git push origin --delete "${GITHUB_REF_NAME}"
